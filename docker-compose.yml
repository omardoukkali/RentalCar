# =============================================================================
#  Global Rental Car Management — Environnement de développement conteneurisé
#  Stack : Laravel 12 (API REST) · Vue 3 (SPA) · PostgreSQL · Nginx
#
#  Lancer :  docker compose up -d --build
#  Arrêter : docker compose down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  Base de données PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: grcm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-grcm}
      POSTGRES_USER: ${DB_USERNAME:-grcm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Exposé en local pour se connecter avec DBeaver / pgAdmin (dev uniquement)
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Le backend attend que la base soit réellement prête avant de démarrer
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-grcm} -d ${DB_DATABASE:-grcm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grcm-net

  # ---------------------------------------------------------------------------
  #  Backend Laravel 12 (PHP-FPM) — logique métier et API REST
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grcm-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Le code est monté en direct : toute modification est prise en compte
      # sans reconstruire l'image (rechargement à chaud côté PHP).
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grcm-net

  # ---------------------------------------------------------------------------
  #  Serveur web Nginx — expose l'API Laravel et relaie le PHP vers PHP-FPM
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: grcm-nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - grcm-net

  # ---------------------------------------------------------------------------
  #  Frontend Vue 3 (Vite) — interface utilisateur (serveur de dev + HMR)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grcm-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Volume anonyme : garde le node_modules du conteneur, non écrasé par l'hôte
    environment:
      # Nécessaire pour que le Hot Module Replacement de Vite marche dans Docker
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - grcm-net

# -----------------------------------------------------------------------------
#  Volumes & réseaux
# -----------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local

networks:
  grcm-net:
    driver: bridge
