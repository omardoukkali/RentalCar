# =============================================================================
#  Configuration Nginx — sert l'API Laravel et relaie le PHP vers PHP-FPM
# =============================================================================
server {
    listen 80;
    server_name localhost;

    # Racine = dossier public de Laravel (point d'entrée : index.php)
    root /var/www/html/public;
    index index.php;

    # Taille max des requêtes (uploads de documents, images de véhicules...)
    client_max_body_size 20M;

    # Toutes les routes non-fichiers sont dirigées vers Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exécution des fichiers PHP via le conteneur backend (PHP-FPM, port 9000)
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Refuse l'accès aux fichiers cachés (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
